name: Build and Release

# This repo already IS the patched source tree (Wine, Wine Staging, the Aqua patches and the
# MNC patches), so CI checks it out and builds it directly.
#
# What this builds: Wine itself plus the "MNC Wine.app" bundle, with every library it needs inside
# the bundle (packaging/).  Nothing in it may depend on Homebrew or on DYLD_* variables:
# packaging/verify-app.py runs at the end and fails the build if anything does.
#
# What else goes into the bundle: GPTK/D3DMetal, the DXMT builds, winemetal and the Rosetta x87
# JIT come from the engine release named by ENGINE_REPO and ENGINE_TAG (packaging/assemble-d3d.sh);
# Wine Mono and Wine Gecko are downloaded from dl.winehq.org.  If one of them cannot be fetched the
# build fails: nothing is released without them.  win32swiftui is not part of this build yet (it has
# no CI of its own); packaging/README.md describes how a release with it is assembled by hand.
#
# A push to a branch builds and keeps the result as a run artifact.  A push to RELEASE_BRANCH also
# publishes it as the pre-release "MacNdCheese Wine 11.20.0" (packaging/prerelease.sh): the next
# build replaces it until the release is marked as stable on GitHub, and the builds after that
# publish 11.20.1, and so on.

on:
  push:
    branches: ['mnc-**']
  workflow_dispatch:

permissions:
  contents: write
  issues: write

env:
  RELEASE_BRANCH: mnc-11.20
  # the engine release that supplies GPTK/D3DMetal, DXMT, winemetal and the Rosetta x87 JIT
  ENGINE_REPO: Macndcheese-org/wine-old
  ENGINE_TAG: 11.18.0

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 180
    env:
      # ccache defaults to invalidating its cache when the compiler binary's
      # mtime changes. Check content instead, matching upstream Wine's own
      # CI (tools/gitlab/build.yml) -- avoids spurious cache misses.
      CCACHE_COMPILERCHECK: content
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install \
            autoconf \
            bison \
            ccache \
            flex \
            freetype \
            gettext \
            gnutls \
            krb5 \
            mingw-w64 \
            pkg-config \
            sdl2

      - name: Add bison, flex, gettext & krb5 to PATH
        run: |
          echo "$(brew --prefix bison)/bin"   >> "$GITHUB_PATH"
          echo "$(brew --prefix flex)/bin"    >> "$GITHUB_PATH"
          echo "$(brew --prefix gettext)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix krb5)/bin"    >> "$GITHUB_PATH"

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/ccache
          key: ccache-${{ runner.os }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ github.ref_name }}-
            ccache-${{ runner.os }}-

      - name: Configure
        run: |
          rm -rf build64 && mkdir build64 && cd build64
          # No -rpath to Homebrew: the libraries are copied into the bundle afterwards.
          CC="ccache clang" \
          CXX="ccache clang++" \
          OBJC="ccache clang" \
          OBJCXX="ccache clang++" \
          LDFLAGS="-L$(xcrun --show-sdk-path)/System/Library/Frameworks/OpenGL.framework/Versions/A/Libraries" \
          PKG_CONFIG_PATH="$(brew --prefix)/lib/pkgconfig" \
          MACOSX_DEPLOYMENT_TARGET=11.0 \
          ../configure \
            --prefix=/opt/mnc-wine \
            --build=x86_64-apple-darwin \
            --enable-win64 \
            --enable-archs=i386,x86_64 \
            --with-coreaudio \
            --with-freetype \
            --with-gnutls \
            --without-gstreamer \
            --with-mingw="ccache clang" \
            --with-sdl \
            --without-vulkan \
            --without-alsa \
            --without-capi \
            --without-dbus \
            --without-oss \
            --without-pulse \
            --without-udev \
            --without-v4l2 \
            --without-x \
            --disable-tests
          # Wine opens these libraries by bare name, which dyld looks up in /usr/local/lib (that is
          # Homebrew).  Turn each into an @rpath/ name so that only the bundle is searched.
          sed -i '' -E 's|^(#define SONAME_LIB[A-Z0-9_]+ ")(lib)|\1@rpath/\2|' include/config.h
          grep '^#define SONAME_LIB' include/config.h

      - name: Build
        run: make -C build64 -j"$(sysctl -n hw.ncpu)"

      - name: Direct3D set, Rosetta x87 JIT, Wine Mono and Wine Gecko
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p parts
          gh release download "$ENGINE_TAG" --repo "$ENGINE_REPO" \
            --pattern wine-unified-osx64.tar.xz --dir parts --clobber
          packaging/assemble-d3d.sh --engine parts/wine-unified-osx64.tar.xz \
            --out parts/d3d-set --rosetta-out parts/rosetta
          rm -f parts/wine-unified-osx64.tar.xz

          mono=$(sed -n 's/^#define MONO_VERSION "\(.*\)"/\1/p' dlls/appwiz.cpl/addons.c)
          gecko=$(sed -n 's/^#define GECKO_VERSION "\(.*\)"/\1/p' dlls/appwiz.cpl/addons.c)
          mkdir -p parts/addons/mono parts/addons/gecko
          curl -fL --retry 3 -o "parts/addons/mono/wine-mono-$mono-x86.msi" \
            "https://dl.winehq.org/wine/wine-mono/$mono/wine-mono-$mono-x86.msi"
          for arch in x86 x86_64; do
            curl -fL --retry 3 -o "parts/addons/gecko/wine-gecko-$gecko-$arch.msi" \
              "https://dl.winehq.org/wine/wine-gecko/$gecko/wine-gecko-$gecko-$arch.msi"
          done

      - name: Release number
        id: number
        if: ${{ github.ref_name == env.RELEASE_BRANCH }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "tag=$(packaging/prerelease.sh tag)" >> "$GITHUB_OUTPUT"

      - name: Package
        id: package
        run: |
          # 11.20.0 on the release branch, otherwise the wine version with the commit
          VERSION="${{ steps.number.outputs.tag }}"
          [ -n "$VERSION" ] || VERSION="$(grep -o '[0-9][0-9.]*' VERSION | head -1).0-$(git rev-parse --short HEAD)"

          make -C build64 install DESTDIR="$GITHUB_WORKSPACE/dist"
          packaging/build-app.sh \
            --install-dir "$GITHUB_WORKSPACE/dist/opt/mnc-wine" \
            --config-h build64/include/config.h \
            --d3d-dir parts/d3d-set \
            --rosetta-dir parts/rosetta \
            --addons-dir parts/addons \
            --version "$VERSION" \
            --out "$GITHUB_WORKSPACE/out" \
            --archive

          echo "asset=MNC-Wine-$VERSION-osx64.tar.xz" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Keep the build
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.asset }}
          path: out/${{ steps.package.outputs.asset }}
          retention-days: 14

      - name: Upload config.log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: config-log
          path: build64/config.log
          retention-days: 7

      - name: Publish the pre-release
        if: ${{ github.ref_name == env.RELEASE_BRANCH }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: packaging/prerelease.sh publish "${{ steps.number.outputs.tag }}" "out/${{ steps.package.outputs.asset }}"

  on-failure:
    needs: build
    if: ${{ always() && needs.build.result == 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open build-failure issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          TITLE="build: ${{ github.ref_name }} failed to build (${{ github.sha }})"
          # gh issue create fails when a label does not exist; a fork starts with the default ones only
          gh label create build-failure --repo "${{ github.repository }}" --color D73A4A --force
          gh label create automated --repo "${{ github.repository }}" --color 6A737D --force
          gh issue create --repo "${{ github.repository }}" \
            --title "$TITLE" \
            --label "build-failure,automated" \
            --body "Automated build for commit ${{ github.sha }} on ${{ github.ref_name }} failed.

          Failing run: ${RUN_URL}"
