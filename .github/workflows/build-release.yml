name: Build and Release

# This repo already IS the patched source tree (Wine, Wine Staging, the Aqua patches and the
# MNC patches), so CI checks it out and builds it directly.
#
# What this builds: Wine itself plus the "MNC Wine.app" bundle, with every library it needs inside
# the bundle (packaging/).  Nothing in it may depend on Homebrew or on DYLD_* variables:
# packaging/verify-app.py runs at the end and fails the build if anything does.
#
# What it does not contain: GPTK/D3DMetal, the DXMT builds and win32swiftui.  They come from
# files that are not in this repository; packaging/README.md describes how the complete release is
# assembled from this build with packaging/import-gptk.sh and packaging/build-app.sh.
#
# A branch push builds and keeps the result as a run artifact.  A release is made only for a tag
# of the form 11.20.0 (or by running the workflow by hand and asking for it).

on:
  push:
    branches: ['mnc-**']
    tags: ['[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Create a GitHub release from this build'
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 180
    env:
      # ccache defaults to invalidating its cache when the compiler binary's
      # mtime changes. Check content instead, matching upstream Wine's own
      # CI (tools/gitlab/build.yml) -- avoids spurious cache misses.
      CCACHE_COMPILERCHECK: content
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install \
            autoconf \
            bison \
            ccache \
            flex \
            freetype \
            gettext \
            gnutls \
            krb5 \
            mingw-w64 \
            pkg-config \
            sdl2

      - name: Add bison, flex, gettext & krb5 to PATH
        run: |
          echo "$(brew --prefix bison)/bin"   >> "$GITHUB_PATH"
          echo "$(brew --prefix flex)/bin"    >> "$GITHUB_PATH"
          echo "$(brew --prefix gettext)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix krb5)/bin"    >> "$GITHUB_PATH"

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/ccache
          key: ccache-${{ runner.os }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ github.ref_name }}-
            ccache-${{ runner.os }}-

      - name: Configure
        run: |
          rm -rf build64 && mkdir build64 && cd build64
          # No -rpath to Homebrew: the libraries are copied into the bundle afterwards.
          CC="ccache clang" \
          CXX="ccache clang++" \
          OBJC="ccache clang" \
          OBJCXX="ccache clang++" \
          LDFLAGS="-L$(xcrun --show-sdk-path)/System/Library/Frameworks/OpenGL.framework/Versions/A/Libraries" \
          PKG_CONFIG_PATH="$(brew --prefix)/lib/pkgconfig" \
          MACOSX_DEPLOYMENT_TARGET=11.0 \
          ../configure \
            --prefix=/opt/mnc-wine \
            --build=x86_64-apple-darwin \
            --enable-win64 \
            --enable-archs=i386,x86_64 \
            --with-coreaudio \
            --with-freetype \
            --with-gnutls \
            --without-gstreamer \
            --with-mingw="ccache clang" \
            --with-sdl \
            --without-vulkan \
            --without-alsa \
            --without-capi \
            --without-dbus \
            --without-oss \
            --without-pulse \
            --without-udev \
            --without-v4l2 \
            --without-x \
            --disable-tests
          # Wine opens these libraries by bare name, which dyld looks up in /usr/local/lib (that is
          # Homebrew).  Turn each into an @rpath/ name so that only the bundle is searched.
          sed -i '' -E 's|^(#define SONAME_LIB[A-Z0-9_]+ ")(lib)|\1@rpath/\2|' include/config.h
          grep '^#define SONAME_LIB' include/config.h

      - name: Build
        run: make -C build64 -j"$(sysctl -n hw.ncpu)"

      - name: Package
        id: package
        run: |
          # 11.20.0 for a tag, otherwise the wine version with the commit
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then VERSION="$GITHUB_REF_NAME"
          else VERSION="$(grep -o '[0-9][0-9.]*' VERSION | head -1).0-$(git rev-parse --short HEAD)"; fi

          make -C build64 install DESTDIR="$GITHUB_WORKSPACE/dist"
          packaging/build-app.sh \
            --install-dir "$GITHUB_WORKSPACE/dist/opt/mnc-wine" \
            --config-h build64/include/config.h \
            --version "$VERSION" \
            --out "$GITHUB_WORKSPACE/out" \
            --archive

          echo "asset=MNC-Wine-$VERSION-osx64.tar.xz" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Keep the build
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.asset }}
          path: out/${{ steps.package.outputs.asset }}
          retention-days: 14

      - name: Upload config.log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: config-log
          path: build64/config.log
          retention-days: 7

      - name: Create release
        if: ${{ github.ref_type == 'tag' || inputs.publish }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.package.outputs.version }}" \
            "out/${{ steps.package.outputs.asset }}" \
            --repo "${{ github.repository }}" \
            --title "MNC Wine ${{ steps.package.outputs.version }}" \
            --notes "Built from $(git log -1 --format='%H') ($(git log -1 --format='%s'))."

  on-failure:
    needs: build
    if: ${{ always() && needs.build.result == 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open build-failure issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          TITLE="build: ${{ github.ref_name }} failed to build (${{ github.sha }})"
          gh issue create --repo "${{ github.repository }}" \
            --title "$TITLE" \
            --label "build-failure,automated" \
            --body "Automated build for commit ${{ github.sha }} on ${{ github.ref_name }} failed.

          Failing run: ${RUN_URL}"
